version: '3.8'

services:
  # ============================================================
  # Reverse Proxy - Traefik
  # ============================================================
  traefik:
    image: traefik:v3.6.1
    container_name: waiting-room-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=waiting-room_waiting-room-public"
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt (TLS challenge)
      - "--certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      # (optional) Dashboard - enable only if needed
      # - "--api.dashboard=true"
      # - "--api.insecure=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=DEBUG"

    ports:
      - "80:80"
      - "443:443"
      # (optional) dashboard on 8080 if enabled above
      # - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - waiting-room-public

  # ============================================================
  # MongoDB (internal only)
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: waiting-room-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: waiting_room
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - waiting-room-internal

  # ============================================================
  # API Server
  # ============================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: waiting-room-api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/waiting_room
      ADDR: ":8080"
      CONFIG_PATH: /app/config.prod.yaml
    volumes:
      - ./api/config.prod.yaml:/app/config.prod.yaml:ro
    depends_on:
      - mongodb
    networks:
      - waiting-room-internal
      - waiting-room-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=le"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ============================================================
  # Kiosk Application
  # ============================================================
  kiosk:
    build:
      context: ./ui-nx
      dockerfile: Dockerfile.kiosk
    container_name: waiting-room-kiosk
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - waiting-room-internal
      - waiting-room-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=waiting-room-public"
      - "traefik.http.routers.kiosk.rule=Host(`kiosk.${DOMAIN}`)"
      - "traefik.http.routers.kiosk.entrypoints=websecure"
      - "traefik.http.routers.kiosk.tls.certresolver=le"
      - "traefik.http.routers.kiosk.service=kiosk"
      - "traefik.http.services.kiosk.loadbalancer.server.port=80"
      - "traefik.http.services.kiosk.loadbalancer.server.scheme=http"
      # Route /api and /ws requests to the API service
      - "traefik.http.routers.kiosk-api.rule=Host(`kiosk.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.kiosk-api.entrypoints=websecure"
      - "traefik.http.routers.kiosk-api.tls.certresolver=le"
      - "traefik.http.routers.kiosk-api.service=api"
      - "traefik.http.routers.kiosk-ws.rule=Host(`kiosk.${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.kiosk-ws.entrypoints=websecure"
      - "traefik.http.routers.kiosk-ws.tls.certresolver=le"
      - "traefik.http.routers.kiosk-ws.service=api"

  # ============================================================
  # Mobile Application
  # ============================================================
  mobile:
    build:
      context: ./ui-nx
      dockerfile: Dockerfile.mobile
    container_name: waiting-room-mobile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - waiting-room-internal
      - waiting-room-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=waiting-room-public"
      - "traefik.http.routers.mobile.rule=Host(`mobile.${DOMAIN}`)"
      - "traefik.http.routers.mobile.entrypoints=websecure"
      - "traefik.http.routers.mobile.tls.certresolver=le"
      - "traefik.http.routers.mobile.service=mobile"
      - "traefik.http.services.mobile.loadbalancer.server.port=80"
      - "traefik.http.services.mobile.loadbalancer.server.scheme=http"
      # Route /api and /ws requests to the API service
      - "traefik.http.routers.mobile-api.rule=Host(`mobile.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.mobile-api.entrypoints=websecure"
      - "traefik.http.routers.mobile-api.tls.certresolver=le"
      - "traefik.http.routers.mobile-api.service=api"
      - "traefik.http.routers.mobile-ws.rule=Host(`mobile.${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.mobile-ws.entrypoints=websecure"
      - "traefik.http.routers.mobile-ws.tls.certresolver=le"
      - "traefik.http.routers.mobile-ws.service=api"

  # ============================================================
  # TV Display
  # ============================================================
  tv:
    build:
      context: ./ui-nx
      dockerfile: Dockerfile.tv
    container_name: waiting-room-tv
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - waiting-room-internal
      - waiting-room-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=waiting-room-public"
      - "traefik.http.routers.tv.rule=Host(`tv.${DOMAIN}`)"
      - "traefik.http.routers.tv.entrypoints=websecure"
      - "traefik.http.routers.tv.tls.certresolver=le"
      - "traefik.http.routers.tv.service=tv"
      - "traefik.http.services.tv.loadbalancer.server.port=80"
      - "traefik.http.services.tv.loadbalancer.server.scheme=http"
      # Route /api and /ws requests to the API service
      - "traefik.http.routers.tv-api.rule=Host(`tv.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tv-api.entrypoints=websecure"
      - "traefik.http.routers.tv-api.tls.certresolver=le"
      - "traefik.http.routers.tv-api.service=api"
      - "traefik.http.routers.tv-ws.rule=Host(`tv.${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.tv-ws.entrypoints=websecure"
      - "traefik.http.routers.tv-ws.tls.certresolver=le"
      - "traefik.http.routers.tv-ws.service=api"

  # ============================================================
  # Backoffice
  # ============================================================
  backoffice:
    build:
      context: ./ui-nx
      dockerfile: Dockerfile.backoffice
    container_name: waiting-room-backoffice
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - waiting-room-internal
      - waiting-room-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=waiting-room-public"
      - "traefik.http.routers.backoffice.rule=Host(`backoffice.${DOMAIN}`)"
      - "traefik.http.routers.backoffice.entrypoints=websecure"
      - "traefik.http.routers.backoffice.tls.certresolver=le"
      - "traefik.http.routers.backoffice.service=backoffice"
      - "traefik.http.services.backoffice.loadbalancer.server.port=80"
      - "traefik.http.services.backoffice.loadbalancer.server.scheme=http"
      # Route /api and /ws requests to the API service
      - "traefik.http.routers.backoffice-api.rule=Host(`backoffice.${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backoffice-api.entrypoints=websecure"
      - "traefik.http.routers.backoffice-api.tls.certresolver=le"
      - "traefik.http.routers.backoffice-api.service=api"
      - "traefik.http.routers.backoffice-ws.rule=Host(`backoffice.${DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.backoffice-ws.entrypoints=websecure"
      - "traefik.http.routers.backoffice-ws.tls.certresolver=le"
      - "traefik.http.routers.backoffice-ws.service=api"

  # ============================================================
  # Card Reader (optional)
  # ============================================================
  card-reader:
    build:
      context: ./card-reader
      dockerfile: Dockerfile
    container_name: waiting-room-card-reader
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      ROOM_ID: triage-1
      DEVICE_ID: reader-01
      # Inside Docker, talk directly to the kiosk service on port 80:
      WS_URL: ws://kiosk/ws/card-reader
      # If you ever run the card reader OUTSIDE docker, use instead:
      # WS_URL: wss://kiosk.${DOMAIN}/ws/card-reader
    depends_on:
      - kiosk
    networks:
      - waiting-room-internal

# ==============================================================
# Volumes & Networks
# ==============================================================

volumes:
  mongodb_data:
  letsencrypt:

networks:
  waiting-room-internal:
    driver: bridge
  waiting-room-public:
    driver: bridge